<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>&#39033;&#30446;&#20840;&#21608;&#26399;&#31649;&#29702; - &#30331;&#24405;</title>
  <link rel="stylesheet" href="css/style.css?v=20261015-1">
  <style>
    :root {
      --ink: #102a43;
      --muted: #627d98;
      --line: #d9e2ec;
      --teal: #2563eb;
      --teal-dark: #1d4ed8;
      --blue: #2b6cb0;
    }
    body.auth-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        radial-gradient(1100px 550px at 85% -10%, rgba(59, 130, 246, 0.32), transparent 60%),
        radial-gradient(850px 480px at -10% 108%, rgba(14, 165, 233, 0.22), transparent 55%),
        linear-gradient(160deg, #12263f 0%, #16324f 48%, #0b1a2e 100%);
      color: var(--ink);
    }
    body.auth-page::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: radial-gradient(ellipse 78% 68% at 50% 42%, #000 35%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 78% 68% at 50% 42%, #000 35%, transparent 100%);
      pointer-events: none;
    }
    .auth-shell {
      position: relative;
      z-index: 1;
      width: min(92vw, 390px);
    }
    .auth-brand {
      margin-bottom: 22px;
      text-align: center;
      color: #fff;
      text-shadow: 0 3px 18px rgba(0, 0, 0, 0.42);
    }
    .auth-brand h1 {
      margin: 14px 0 0;
      font-size: 32px;
      line-height: 1.2;
      letter-spacing: 0;
    }
    .auth-card {
      width: 100%;
      padding: 34px 32px 28px;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 22px 55px rgba(10, 31, 42, 0.28);
      backdrop-filter: blur(10px);
    }
    .auth-card h2 {
      margin: 0 0 8px;
      color: var(--ink);
      font-size: 22px;
      line-height: 1.25;
      text-align: center;
    }
    .auth-card > p {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }
    .auth-form label {
      display: block;
      margin-bottom: 18px;
      color: #486581;
      font-size: 13px;
      font-weight: 600;
    }
    .auth-form input[type="text"],
    .auth-form input[type="password"] {
      display: block;
      width: 100%;
      height: 42px;
      margin-top: 7px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfdff;
      color: var(--ink);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    .auth-form input[type="text"]:focus,
    .auth-form input[type="password"]:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(43, 108, 176, 0.12);
      background: #fff;
    }
    .auth-remember {
      display: inline-flex !important;
      align-items: center;
      gap: 8px;
      margin: -2px 0 20px !important;
      color: var(--muted) !important;
      font-size: 13px !important;
      font-weight: 400 !important;
      cursor: pointer;
      user-select: none;
    }
    .auth-remember input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--teal);
      cursor: pointer;
    }
    .auth-actions .btn {
      width: 100%;
      min-height: 42px;
      border-radius: 8px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border-color: transparent;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }
    .auth-actions .btn:hover {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-color: transparent;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.45);
    }
    .auth-message {
      min-height: 20px;
      margin-top: 12px;
      color: #c0392b;
      font-size: 13px;
    }
    @media (max-width: 520px) {
      body.auth-page { padding: 18px; }
      .auth-brand h1 { font-size: 28px; }
      .auth-card { padding: 30px 24px 24px; }
    }
  </style>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <header class="auth-brand">
      <h1>&#39033;&#30446;&#20840;&#21608;&#26399;&#31649;&#29702;</h1>
    </header>

    <section class="auth-card">
      <h2>&#27426;&#36814;&#22238;&#26469;</h2>
      <p>&#35831;&#30331;&#24405;&#21518;&#32487;&#32493;&#12290;</p>
      <form id="loginForm" class="auth-form">
        <label>&#29992;&#25143;&#21517;
          <input type="text" id="loginUsername" required maxlength="50" autocomplete="username" placeholder="&#36755;&#20837;&#36134;&#21495;">
        </label>
        <label>&#23494;&#30721;
          <input type="password" id="loginPassword" required maxlength="100" autocomplete="current-password" placeholder="&#36755;&#20837;&#23494;&#30721;">
        </label>
        <label class="auth-remember">
          <input type="checkbox" id="rememberUsername">
          <span>&#35760;&#20303;&#29992;&#25143;&#21517;&#65288;&#20165;&#27492;&#35774;&#22791;&#65289;</span>
        </label>
        <div class="auth-actions">
          <button type="submit" class="btn btn-primary">&#30331;&#24405;</button>
        </div>
        <div id="loginMessage" class="auth-message"></div>
      </form>
    </section>
  </main>

  <script>
    const TOKEN_KEY = 'bugclose_token';
    const REMEMBERED_USERNAME_KEY = 'bugclose_remembered_username';
    const LOGIN_API = '/api/auth/login';

    const usernameEl = document.getElementById('loginUsername');
    const passwordEl = document.getElementById('loginPassword');
    const rememberEl = document.getElementById('rememberUsername');
    const messageEl = document.getElementById('loginMessage');
    const getToken = () => localStorage.getItem(TOKEN_KEY);
    const setToken = (token) => {
      if (token) localStorage.setItem(TOKEN_KEY, token);
      else localStorage.removeItem(TOKEN_KEY);
    };
    const getNextUrl = () => {
      const params = new URLSearchParams(location.search);
      const next = params.get('next');
      // 仅允许站内相对路径；拒绝 "//evil.com" 这类协议相对跳转
      return next && next.startsWith('/') && !next.startsWith('//') ? next : '/';
    };
    const showMessage = (msg) => { messageEl.textContent = msg || ''; };

    // 安全整改：历史版本曾明文存密码，这里统一清理，只保留用户名
    localStorage.removeItem('bugclose_remembered_password');

    const rememberedUsername = localStorage.getItem(REMEMBERED_USERNAME_KEY);
    if (rememberedUsername) {
      usernameEl.value = rememberedUsername;
      rememberEl.checked = true;
    }

    if (getToken()) {
      location.replace(getNextUrl());
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      showMessage('');
      const username = usernameEl.value.trim();
      const password = passwordEl.value;
      if (!username || !password) {
        showMessage('\u8bf7\u586b\u5199\u7528\u6237\u540d\u548c\u5bc6\u7801');
        return;
      }
      try {
        const resp = await fetch(LOGIN_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await resp.json().catch(() => null);
        if (!resp.ok) {
          throw new Error((data && data.error) || `\u767b\u5f55\u5931\u8d25 (${resp.status})`);
        }
        if (rememberEl.checked) {
          localStorage.setItem(REMEMBERED_USERNAME_KEY, username);
        } else {
          localStorage.removeItem(REMEMBERED_USERNAME_KEY);
        }
        setToken(data.token);
        location.replace(getNextUrl());
      } catch (err) {
        showMessage(err.message || '\u767b\u5f55\u5931\u8d25');
      }
    });

    // 已记住用户名时直接聚焦密码框
    (rememberedUsername ? passwordEl : usernameEl).focus();
  </script>
</body>
</html>
