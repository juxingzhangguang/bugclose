spring.application.name=bugclose
server.port=8080

# H2 文件数据库：数据持久化到项目 data 目录
spring.datasource.url=jdbc:h2:file:./data/bugclose;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 控制台（调试用，浏览器访问 /h2-console）
spring.h2.console.enabled=true

# 上传限制（全局 multipart 上限；Bug 图片 5MB 限制由 UploadController 代码内控制）
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB
