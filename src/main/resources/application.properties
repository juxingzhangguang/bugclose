spring.application.name=bugclose
server.port=8080

# MySQL 数据库（bugclose 专用账号，由安装脚本创建；密码通过环境变量 BUGCLOSE_DB_PASSWORD 注入）
spring.datasource.url=jdbc:mysql://localhost:3306/bugclose?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=bugclose
spring.datasource.password=${BUGCLOSE_DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 上传限制（全局 multipart 上限；Bug 图片 5MB 限制由 UploadController 代码内控制）
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB
