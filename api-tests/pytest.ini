[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
    --color=yes
    --junitxml=reports/junit.xml
    --html=reports/report.html
    --self-contained-html
markers =
    case(cid): 关联接口测试用例编号（与 cases/ 下的用例文档一一对应）
    slow: 耗时较长的用例（批量导入、并发等）
filterwarnings =
    ignore::DeprecationWarning